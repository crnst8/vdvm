# Drums media origin. Serves the app shell (built into the image) plus the
# catalog and media trees rsynced to /srv/data. Cloudflare sits in front via
# the tunnel; everything under media/ and catalog/kits|credits is
# content-addressed, so it is cached for a year. Top-level catalog JSON is
# revalidated so a new catalog revision shows up on the next load.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    charset utf-8;

    gzip on;
    gzip_types application/json text/css application/javascript image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;

    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    # The Pages shell on re20.one reads catalog and media cross-origin. The
    # content is public, so a wildcard origin keeps edge caching simple.
    location ~ ^/(catalog|media)/ {
        root /srv/data;
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header X-Content-Type-Options nosniff always;
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS";
            add_header Access-Control-Max-Age 86400;
            return 204;
        }
        location ~ ^/catalog/[^/]+\.json$ {
            root /srv/data;
            add_header Access-Control-Allow-Origin * always;
            add_header X-Content-Type-Options nosniff always;
            add_header Cache-Control "no-cache" always;
        }
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
    }
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
    }
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
    }
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri $uri/ /index.html;
    }
}
